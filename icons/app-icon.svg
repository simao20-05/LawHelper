    <path d="M160 192l-42 74h84l-42-74Z" stroke-width="10"/>
    <path d="M352 192l-42 74h84l-42-74Z" stroke-width="10"/>
    <path d="M168 286c12 24 48 24 60 0" stroke-width="10"/>
    <path d="M344 286c12 24 48 24 60 0" stroke-width="10"/>
    <path d="M208 382h96" stroke-width="14"/>
